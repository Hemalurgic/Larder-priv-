# Proposed models for the POC tests, via OpenRouter (LiteLLM prefix "openrouter/", key in OPENROUTER_API_KEY).
# Prices: USD per 1M tokens, input/output, from third-party snapshots of OpenRouter's list, 14-28 Oct 2026.
# CONFIRM every id and price on openrouter.ai/models before running, then pin the exact versioned id.
# Prices move: some DeepSeek routes changed price within two days in late October 2026.

recipe_generation:          # round 1: all three x templates A and B x 15 briefs
  premium: {id: anthropic/claude-sonnet-5.5,  price: [2.00, 10.00]}
  mid:     {id: google/gemini-3.8-flash,      price: [0.75, 3.75]}
  budget:  {id: deepseek/deepseek-v4.1-flash, price: [0.14, 0.42], note: "open weights; could be self-hosted later"}

critic:                     # different provider from the generators, so no model marks its own family's work
  id: openai/gpt-6.1-sol
  price: [2.00, 10.00]

routing_parser:             # run with --repeats 3
  - {id: anthropic/claude-haiku-5.5, price: [0.10, 0.50]}
  - {id: openai/gpt-5.6-luna,        price: [0.20, 1.20]}
  - {id: openai/gpt-oss-20b,         price: [0.018, 0.09], note: "tiny open-weight model; self-hostable floor"}
  ceiling: {id: anthropic/claude-sonnet-5.5, note: "one run only, to see how much a big model adds"}

# Commands
# export OPENROUTER_API_KEY=...
# python -m generation.run_round --round 1 --half A --templates A,B \
#   --models openrouter/anthropic/claude-sonnet-5.5,openrouter/google/gemini-3.8-flash,openrouter/deepseek/deepseek-v4.1-flash \
#   --critic openrouter/openai/gpt-6.1-sol
# python -m evals.score_parser --parser llm:openrouter/anthropic/claude-haiku-5.5 --repeats 3 --out runs/parser_haiku.jsonl --show-failures
