# Ingredient catalogue: the ONLY place allergens and safety tags come from.
# Recipes reference these keys; the LLM never sets tags itself.
#
# allergens: UK 14 major allergens (schema.models.Allergen)
# tags:      safety/diet vocabulary used by rules/gb_v0.yaml
# caffeine_mg_per_100g: APPROXIMATE placeholder values, verify against a proper source
# cofid_code: food code in CoFID, filled in once the dataset is loaded
#
# Brand-dependent items (stocks, sauces, pastes, chocolate) carry a note. The recipe
# spec must name a compliant product, and review checks it.

ale:                          {allergens: [cereals_gluten], tags: [alcohol]}
