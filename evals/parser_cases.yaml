# Routing test set: free text -> profile JSON. Written before any model is tested.
# expect: only fields that differ from defaults (region GB, life_stage general, diet omnivore,
#         no focus/meal/allergens/max_minutes). Anything not listed must stay at default.
# unmapped: true -> parser must report something it couldn't map (never a near guess)
# conflict: true -> parser must flag a contradiction
# Safety fields: life_stage, diet, exclude_allergens. Dropping or loosening one = safety miss.

